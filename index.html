<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>粒子爱心</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #000; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="canvas"></canvas>
<script>
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

// ========== 自定义文字 ==========
const TEXT = "欧阳慧";  // ← 修改这里自定义文字
const TEXT_SIZE = 48;
// =================================

function resize() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
resize();
window.addEventListener("resize", resize);

function heartX(t) {
  return 16 * Math.pow(Math.sin(t), 3);
}
function heartY(t) {
  return -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t));
}

function isInsideHeart(px, py) {
  const a = px * px + py * py - 1;
  return a * a * a - px * px * py * py * py <= 0;
}

class Particle {
  constructor(type) {
    this.type = type;
    this.reset();
  }
  reset() {
    if (this.type === 'edge') {
      const t = Math.random() * Math.PI * 2;
      const hx = heartX(t);
      const hy = heartY(t);
      // 多层散射 — 形成厚实的带状轮廓
      const r = Math.random();
      let spread;
      if (r < 0.4) {
        spread = (Math.random() - 0.5) * 0.8; // 核心层 — 极紧
      } else if (r < 0.75) {
        spread = (Math.random() - 0.5) * 1.8; // 中间层
      } else {
        spread = (Math.random() - 0.5) * 3.0; // 外层
      }
      const angle = Math.random() * Math.PI * 2;
      this.baseX = hx + Math.cos(angle) * spread;
      this.baseY = hy + Math.sin(angle) * spread;
    } else if (this.type === 'scatter') {
      const t = Math.random() * Math.PI * 2;
      const hx = heartX(t);
      const hy = heartY(t);
      const spread = 2.0 + Math.random() * 2.5;
      const angle = Math.random() * Math.PI * 2;
      this.baseX = hx + Math.cos(angle) * spread;
      this.baseY = hy + Math.sin(angle) * spread;
    } else {
      let x, y;
      do {
        x = (Math.random() - 0.5) * 28;
        y = (Math.random() - 0.5) * 24;
      } while (!isInsideHeart(x / 16, y / 16));
      this.baseX = x;
      this.baseY = y;
    }

    this.driftX = (Math.random() - 0.5) * 1.0;
    this.driftY = (Math.random() - 0.5) * 1.0;
    this.targetDriftX = (Math.random() - 0.5) * 1.8;
    this.targetDriftY = (Math.random() - 0.5) * 1.8;
    this.driftSpeed = Math.random() * 0.008 + 0.002;

    this.size = Math.random() * 0.7 + 0.25;
    this.alpha = Math.random() * 0.15 + 0.85;
    this.alphaSpeed = Math.random() * 0.002 + 0.0005;
    this.alphaDir = Math.random() > 0.5 ? 1 : -1;

    // 更粉的颜色
    const rand = Math.random();
    if (rand < 0.45) {
      // 亮粉
      this.r = 255;
      this.g = 140 + Math.floor(Math.random() * 30);
      this.b = 180 + Math.floor(Math.random() * 25);
    } else if (rand < 0.75) {
      // 粉白
      this.r = 255;
      this.g = 160 + Math.floor(Math.random() * 35);
      this.b = 190 + Math.floor(Math.random() * 25);
    } else {
      // 浅粉
      this.r = 250 + Math.floor(Math.random() * 5);
      this.g = 130 + Math.floor(Math.random() * 30);
      this.b = 165 + Math.floor(Math.random() * 25);
    }

    this.flickerPhase = Math.random() * Math.PI * 2;
    this.flickerSpeed = Math.random() * 1.8 + 0.4;
  }
  update(time) {
    this.driftX += (this.targetDriftX - this.driftX) * this.driftSpeed;
    this.driftY += (this.targetDriftY - this.driftY) * this.driftSpeed;
    if (Math.abs(this.targetDriftX - this.driftX) < 0.08 &&
        Math.abs(this.targetDriftY - this.driftY) < 0.08) {
      this.targetDriftX = (Math.random() - 0.5) * 1.8;
      this.targetDriftY = (Math.random() - 0.5) * 1.8;
    }
    this.alpha += this.alphaDir * this.alphaSpeed;
    if (this.alpha > 1) { this.alpha = 1; this.alphaDir = -1; }
    if (this.alpha < 0.45) { this.alpha = 0.45; this.alphaDir = 1; }
  }
  draw(cx, cy, scale, time) {
    const x = cx + this.baseX * scale + this.driftX;
    const y = cy + this.baseY * scale + this.driftY;
    const flicker = 0.92 + 0.08 * Math.sin(time * this.flickerSpeed + this.flickerPhase);
    const a = this.alpha * flicker;
    const s = this.size * Math.min(scale, 2.2);

    // 极小光晕
    const glowR = s * 1.2;
    const glow = ctx.createRadialGradient(x, y, 0, x, y, glowR);
    glow.addColorStop(0, `rgba(${this.r}, ${this.g}, ${this.b}, ${a * 0.05})`);
    glow.addColorStop(1, `rgba(${this.r}, ${this.g}, ${this.b}, 0)`);
    ctx.beginPath();
    ctx.arc(x, y, glowR, 0, Math.PI * 2);
    ctx.fillStyle = glow;
    ctx.fill();

    // 像素亮点
    ctx.fillStyle = `rgba(${this.r}, ${this.g}, ${this.b}, ${a})`;
    ctx.fillRect(x - s * 0.5, y - s * 0.5, s, s);

    // 白色中心
    ctx.beginPath();
    ctx.arc(x, y, s * 0.35, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(255, 255, 255, ${a})`;
    ctx.fill();
  }
}

const particles = [];
// 轮廓主带 — 超大量
for (let i = 0; i < 4500; i++) {
  particles.push(new Particle('edge'));
}
// 外散粒子
for (let i = 0; i < 400; i++) {
  particles.push(new Particle('scatter'));
}
// 内部填充
for (let i = 0; i < 350; i++) {
  particles.push(new Particle('inner'));
}

let startTime = Date.now();
function animate() {
  requestAnimationFrame(animate);
  const time = (Date.now() - startTime) / 1000;
  const w = canvas.width;
  const h = canvas.height;

  ctx.fillStyle = "rgba(0, 0, 0, 0.4)";
  ctx.fillRect(0, 0, w, h);

  const cx = w / 2;
  const cy = h / 2;

  // 粉色辉光
  const gp = 0.6 + 0.15 * Math.sin(time * 2.0);
  const gg = ctx.createRadialGradient(cx, cy, 0, cx, cy, Math.min(w, h) * 0.32);
  gg.addColorStop(0, `rgba(255, 120, 170, ${0.06 * gp})`);
  gg.addColorStop(0.5, `rgba(255, 90, 140, ${0.03 * gp})`);
  gg.addColorStop(1, "rgba(0,0,0,0)");
  ctx.fillStyle = gg;
  ctx.fillRect(0, 0, w, h);

  // 呼吸跳动 — 明显的周期性放大缩小
  const breathCycle = Math.sin(time * 2.0) * 0.06;       // 缓慢呼吸
  const beatPulse  = Math.pow(Math.sin(time * 4.0), 8) * 0.08; // 心跳脉冲
  const baseScale = Math.min(w, h) * 0.017;
  const scale = baseScale * (1 + breathCycle + beatPulse);

  for (const p of particles) {
    p.update(time);
    p.draw(cx, cy, scale, time);
  }

  // 绘制中心文字 — 随爱心呼吸跳动
  const textScale = 1 + breathCycle + beatPulse;
  ctx.save();
  ctx.translate(cx, cy);
  ctx.scale(textScale, textScale);
  ctx.font = `bold ${TEXT_SIZE}px "PingFang SC", "Microsoft YaHei", sans-serif`;
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  // 粉色文字 + 白色描边
  ctx.strokeStyle = `rgba(255, 255, 255, ${0.7 + Math.sin(time * 2.0) * 0.2})`;
  ctx.lineWidth = 2;
  ctx.strokeText(TEXT, 0, 0);
  ctx.fillStyle = `rgba(255, 170, 200, ${0.85 + Math.sin(time * 2.0) * 0.15})`;
  ctx.fillText(TEXT, 0, 0);
  ctx.restore();
}
animate();
</script>
</body>
</html>
