<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>跳动粒子爱心</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #000; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="canvas"></canvas>
<script>
// ========== 自定义区域 ==========
const TEXT = "爱心跳动";  // ← 修改这里自定义文字内容
const TEXT_SIZE = 42;       // 文字大小
const HEART_COLOR = "rgba(255, 105, 140, ";  // 粉色粒子颜色 (RGB)
const PARTICLE_COUNT = 600; // 粒子数量
// ================================

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

function resize() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
resize();
window.addEventListener("resize", resize);

// 爱心参数方程 — 返回归一化坐标 (需缩放)
function heartX(t) {
  return 16 * Math.pow(Math.sin(t), 3);
}
function heartY(t) {
  return -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t));
}

// 粒子类
class Particle {
  constructor() {
    this.reset();
  }
  reset() {
    // 在爱心轮廓上随机取一个角度
    this.angle = Math.random() * Math.PI * 2;
    // 基础位置（爱心坐标）
    this.baseX = heartX(this.angle);
    this.baseY = heartY(this.angle);
    // 飘散偏移
    this.driftX = (Math.random() - 0.5) * 2.5;
    this.driftY = (Math.random() - 0.5) * 2.5;
    // 粒子大小
    this.size = Math.random() * 2.2 + 0.8;
    // 透明度
    this.alpha = Math.random() * 0.5 + 0.5;
    // 飘散速度
    this.driftSpeed = Math.random() * 0.3 + 0.1;
    // 飘散方向随机角
    this.driftAngle = Math.random() * Math.PI * 2;
  }
  update(time) {
    // 轻微飘散浮动
    this.driftAngle += (Math.random() - 0.5) * 0.1;
    this.driftX += Math.cos(this.driftAngle) * this.driftSpeed * 0.3;
    this.driftY += Math.sin(this.driftAngle) * this.driftSpeed * 0.3;
    // 衰减回中心
    this.driftX *= 0.97;
    this.driftY *= 0.97;
  }
  draw(cx, cy, scale) {
    const x = cx + (this.baseX * scale) + this.driftX;
    const y = cy + (this.baseY * scale) + this.driftY;
    ctx.beginPath();
    ctx.arc(x, y, this.size * scale * 0.6, 0, Math.PI * 2);
    ctx.fillStyle = HEART_COLOR + this.alpha + ")";
    ctx.fill();
  }
}

// 初始化粒子
const particles = [];
for (let i = 0; i < PARTICLE_COUNT; i++) {
  particles.push(new Particle());
}

// 动画主循环
let startTime = Date.now();
function animate() {
  requestAnimationFrame(animate);

  const time = (Date.now() - startTime) / 1000;
  const w = canvas.width;
  const h = canvas.height;

  // 清屏 — 半透明黑色产生拖尾
  ctx.fillStyle = "rgba(0, 0, 0, 0.15)";
  ctx.fillRect(0, 0, w, h);

  // 爱心中心
  const cx = w / 2;
  const cy = h / 2 - 20;

  // 呼吸跳动 — 基础缩放 + 周期脉冲
  const breathCycle = Math.sin(time * 2.2) * 0.08;       // 缓慢呼吸
  const beatPulse  = Math.pow(Math.sin(time * 4.4), 8) * 0.15; // 心跳脉冲
  const baseScale  = Math.min(w, h) * 0.018;
  const scale      = baseScale * (1 + breathCycle + beatPulse);

  // 更新 & 绘制粒子
  for (const p of particles) {
    p.update(time);
    p.draw(cx, cy, scale);
  }

  // 绘制中心文字
  const fontSize = TEXT_SIZE * scale / baseScale;
  ctx.save();
  ctx.translate(cx, cy);
  const textScale = 1 + breathCycle + beatPulse;
  ctx.scale(textScale, textScale);
  ctx.font = `bold ${TEXT_SIZE}px "PingFang SC", "Microsoft YaHei", sans-serif`;
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.fillStyle = `rgba(255, 200, 210, ${0.85 + Math.sin(time * 2.2) * 0.15})`;
  ctx.fillText(TEXT, 0, 0);
  ctx.restore();
}

animate();
</script>
</body>
</html>
